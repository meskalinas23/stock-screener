name: Daily Mean-Reversion Screener

on:
  schedule:
    - cron: "0 13 * * 1-5"   # 13:00 UTC, weekdays — adjust as needed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas yfinance

      - name: screen
        run: python screener.py

      - name: Commit and push report
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add docs/ reports/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update screener results"
          git push
