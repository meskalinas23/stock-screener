name: Daily Mean-Reversion Screener

on:
  schedule:
    # Runs 21:30 UTC = shortly after US market close, Mon-Fri
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run screener
        run: python screener.py

      - name: Commit report
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@github.com"
          git add reports/
          git commit -m "Daily screen $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
